<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Biology Study Resources</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f0f0; text-align: center; }
        .grid { display: flex; justify-content: center; gap: 20px; padding: 20px; }
        .game-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 250px; }
        .hidden-game { display: none; margin-top: 20px; }
        button { padding: 10px 20px; cursor: pointer; background-color: #4CAF50; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>Biology Unit 4: Interactive Review</h1>
    <p>Select a module to begin your interactive study session.</p>

    <div class="grid">
        <!-- Game 1: Sky Riders -->
        <div class="game-card">
            <h3>Cell Structure Sim</h3>
            <p>Interactive 3D cell navigation.</p>
            <button onclick="showGame('sky-riders')">Start Module</button>
        </div>

        <!-- Placeholder for Game 2 -->
        <div class="game-card">
            <h3>Genetic Matching</h3>
            <p>DNA sequence alignment tool.</p>
            <button onclick="alert('Coming soon!')">Start Module</button>
        </div>
    </div>

    <!-- Hidden Game Area -->
    <div id="sky-riders" class="hidden-game">
        <button onclick="hideGame('sky-riders')" style="background-color: #f44336;">Close Module</button>
        <br><br>
        <iframe src="https://crazygames.com" 
                style="width: 80%; height: 600px;" frameborder="0" allowfullscreen></iframe>
    </div>

    <script>
        function showGame(id) { document.getElementById(id).style.display = 'block'; }
        function hideGame(id) { document.getElementById(id).style.display = 'none'; }
    </script>

</body>
</html>
