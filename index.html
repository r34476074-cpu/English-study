<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Unit 4: Advanced Biological Systems</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            background: #ffffff;
            color: #333;
            margin: 0;
            padding: 40px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: left;
            border-top: 5px solid #2c3e50;
            padding-top: 20px;
        }
        h1 {
            font-size: 24px;
            color: #2c3e50;
        }
        .module-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .progress-bar {
            background: #eee;
            width: 150px;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 5px;
        }
        .progress-fill {
            background: #27ae60;
            height: 100%;
            transition: 0.5s;
        }
        .launch-btn {
            background: #34495e;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 3px;
            font-size: 14px;
        }
        .launch-btn:hover {
            background: #2c3e50;
        }
    </style>
</head>
<body>

    <div class="container">
        <p style="color: #666; font-size: 12px;">Logged in as: Student_4492 | District Curriculum v.2.4</p>
        <h1>Section 4.2: Interactive Ecological Modeling</h1>
        <p>Complete the following simulations to unlock the end-of-unit assessment. Your progress is being tracked automatically.</p>

        <div class="module-card">
            <div>
                <strong>Module 1: Trophic Level Dynamics</strong>
                <div class="progress-bar"><div class="progress-fill" style="width: 85%;"></div></div>
            </div>
            <!-- Update the URLs below to your specific destination links -->
            <button class="launch-btn" onclick="launchSimulation('https://blogspot.com')">Resume Simulation</button>
        </div>

        <div class="module-card">
            <div>
                <strong>Module 2: Mendelian Inheritance Patterns</strong>
                <div class="progress-bar"><div class="progress-fill" style="width: 12%;"></div></div>
            </div>
            <button class="launch-btn" onclick="launchSimulation('https://chess.com')">Launch Module</button>
        </div>
    </div>

    <script>
        // Global variable to hold the reference to the active session window
        let activeSession = null;

        function launchSimulation(url) {
            // Opens the link cleanly in a new pop-up style window configuration
            activeSession = window.open(url, '_blank', 'width=1024,height=768');
        }

        function triggerPanicClose() {
            if (activeSession && !activeSession.closed) {
                // Instantly force-closes the external window
                activeSession.close();
            }
            // Forces focus back to the assignment dashboard seamlessly
            window.focus();
        }

        // Monitors system keyboard input for the 'Escape' key 
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                triggerPanicClose();
            }
        });
    </script>
</body>
