
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Eagle Bio-Study Portal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #fff; text-align: center; padding: 20px; }
        .study-box { background: #16213e; padding: 30px; border-radius: 15px; max-width: 700px; margin: 0 auto; border: 2px solid #0f3460; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #e94560; margin-bottom: 5px; }
        .game-link { display: block; padding: 18px; margin: 15px 0; background: #0f3460; border-radius: 10px; text-decoration: none; color: #fff; font-weight: bold; cursor: pointer; transition: all 0.3s ease; border: 1px solid transparent; }
        .game-link:hover { background: #e94560; transform: translateY(-3px); border-color: #fff; }
        #viewer { display: none; margin-top: 30px; animation: fadeIn 0.5s; }
        .panic { background: #e94560; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; cursor: pointer; margin-bottom: 15px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .panic:hover { background: #ff2e63; }
        iframe { border-radius: 15px; border: 4px solid #0f3460; background: #000; width: 100%; height: 75vh; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
